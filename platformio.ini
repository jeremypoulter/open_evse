; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/en/stable/projectconf.html

[platformio]
#default_envs = openevse
src_dir = firmware/open_evse

[common]
lib_deps =
upload_protocol = usbasp
upload_flags = "-e -B0.5"
version = 8.2.3
build_flags =
  -D OEV6
  -D RELAY_PWM
  -D SHOW_DISABLED_TESTS
  -D AMMETER
  -D RAPI
  -D RAPI_SERIAL
  -D RAPI_WF
  -D RAPI_BTN
  #-D TIME_LIMIT
  #-D CHARGE_LIMIT
  -D MENNEKES_LOCK
  -D HEARTBEAT_SUPERVISION
us_build_flags =
  ${common.build_flags}
  -D AUTOSVCLEVEL
  #-D BOOTLOCK
eu_build_flags =
  ${common.build_flags}
  -D NO_AUTOSVCLEVEL
  -D PERIODIC_LCD_REFRESH_MS=120000UL
  -D DEFAULT_CURRENT_CAPACITY_L2=32
  -D MAX_CURRENT_CAPACITY_L2=32
  -D OVERCURRENT_THRESHOLD=5
  -D OVERCURRENT_TIMEOUT=10000UL
  -D DEFAULT_SERVICE_LEVEL=2

[env:openevse_1-8-3]
platform = atmelavr@3.4.0
board = openevse
framework = arduino
lib_deps = ${common.lib_deps}
upload_protocol = ${common.upload_protocol}
upload_flags = ${common.upload_flags}
build_src_flags=
  ${common.us_build_flags}

[env:openevse_latest]
platform = atmelavr
board = openevse
framework = arduino
lib_deps = ${common.lib_deps}
upload_protocol = ${common.upload_protocol}
upload_flags = ${common.upload_flags}
build_src_flags=
  ${common.us_build_flags}

[env:openevse]
extends = env:openevse_1-8-3
build_src_flags=
  ${common.us_build_flags}
  -D 'VERSION="${common.version}"'

# v6 CGMI OpenEVSE
[env:openevse_v6]
extends = env:openevse
build_src_flags=
  ${common.us_build_flags}
  -D ENABLE_CGMI
  -D NO_AUTOSVCLEVEL
  -D DEFAULT_SERVICE_LEVEL=2
  #-D BTN_MENU
  #-D RTC
  -D 'VERSION="${common.version}.CGMI"'

# EU OpenEVSE
[env:openevse_eu]
extends = env:openevse
build_src_flags=
  ${common.eu_build_flags}
  -D MV_FOR_L2=230000L
  -D 'VERSION="${common.version}.EU"'
  -D RAPI_T_COMMANDS
  -D FAKE_CHARGING_CURRENT

[env:openevse_native]
platform = native
framework = 
lib_extra_dirs = ..
lib_deps =
  ${common.lib_deps}
  https://github.com/jeremypoulter/EpoxyDuino.git@open_evse_native
  #EpoxyDuino
build_flags=
  ${common.us_build_flags}
  -D ARDUINO=100
  -D EPOXY_DUINO
  -D EPOXY_CORE_AVR
  -D LCD16X2
  -D ADVPWR
  -D DELAYTIMER_MENU
  -D BTN_MENU
  -D GFI_SELFTEST
  -D TEMPERATURE_MONITORING

# Non-tethered T2 EmonEVSE single-phase
[env:emonevse]
extends = env:openevse
build_src_flags=
  ${common.eu_build_flags}
  -D PP_AUTO_AMPACITY
  -D MV_FOR_L2=230000L
  -D 'VERSION="${common.version}.T2"'

